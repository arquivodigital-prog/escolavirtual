        <div class="login-pf-container">
            <div class="card-pf login-pf-accounts" role="main" style="position:relative;">
            <div class="logoDiv" style="width:100%;">
                <a href="https://www.escolavirtual.pt/" target="_BLANK" aria-label="Página principal da Escola Virtual">

                </a>
            </div>

            <div class="login-pf-header">

                <h1 id="kc-page-title">        <span class="sr-only">Entrar em Escola Virtual</span>
</h1>
            </div>

            <div id="kc-content">
                <div id="kc-content-wrapper">
    <script src="//cdn.escolavirtual.pt/jquery/1.12.0/jquery.min.js"></script>

    <script>
        function inIframe () {
            try {
                return window.self !== window.top;
            } catch (e) {
                return true;
            }
        }
        $(document).ready(function() {
            if(inIframe()) {
                $('#kc-form-wrapper').removeClass();
                $('#kc-registration').remove();
                $('.loginHeader').remove();
            }

            const urlParams = new URLSearchParams(window.location.search);
            const noregister = urlParams.get('noregister');
            if (noregister === '1' || sessionStorage.getItem("noregister")) {
                sessionStorage.setItem("noregister", "1");
                $('#kc-registration').css('display','none');
                $('.login-pf-page .login-pf-accounts').css('max-width','26rem');
                $('.login-pf-page .login-pf-social-section').css('max-width','100%');
                $('.login-pf-social-section').css('width','100%');
                $('.login-pf-page .login-pf-social-section:first-of-type').css('border','none');
                $('.login-pf-page .login-pf-settings').css('display','none');
                $('.loginHeader').css('display','none');
                $('.login-pf-page .login-pf-social-section:first-of-type').css('padding-right','0px');
                $('.logoDiv img').unwrap();
            }
        });
    </script>

        <div id="notInIframe">

                         >

                        <div class="form-group input-default-form">
                            <label for="username" class="input-default-label">
                                    Utilizador
                                <span class="field-star" aria-hidden="true">*</span>
                            </label>

                            <div class="input-default-content">
                                <input id="username" name="username" class="input-default" type="text" value=""   autofocus autocomplete="username" required aria-required="true" title="" />

                                <button id="password-icon" class="show-password-icon-btn" style="display:none;" type="button"
                                      aria-controls="password" aria-label="Mostrar password">
                                      <span class="show-password-icon fa fa-eye" aria-hidden="true"></span>
                                </button>
                            </div>
                            <div id="password-error" class="kc-error-message" role="alert"></div>
                        </div>

                        <div class="login-pf-settings">
                            <div class="option-default-container">
                                <input id="rememberMe" name="rememberMe" type="checkbox" />

                                <a href="/auth/realms/EV/login-actions/reset-credentials?client_id=ev-app-web&amp;tab_id=7suqf428DLY&amp;client_data=eyJydSI6Imh0dHBzOi8vYXBwLmVzY29sYXZpcnR1YWwucHQvcG9ydGFsL2F1dGgvY2FsbGJhY2siLCJydCI6ImNvZGUiLCJzdCI6ImQ0ZTdlNDZlZjFiNGZkMjQ1ZTY5NjBjM2JhM2NkYmMwIn0" class="recover-access-data link-default">Não sei a password</a>
                        </div>

                        <div class="form-group">

                        </div>
                    </form>

                    </div>
                </div>
        </div>
    </div>

                        <div id="kc-info" class="login-pf-signup">
